name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Всё, что лежит в репозитории, закрыто от поисковиков меткой PREVIEW-NOINDEX.
      # Страница без метки на Pages не выкладывается.
      - name: Проверить noindex
        run: |
          for f in $(find site -name '*.html'); do
            grep -q 'PREVIEW-NOINDEX' "$f" || { echo "Нет noindex: $f"; exit 1; }
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
