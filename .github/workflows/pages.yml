name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Превью не индексируется. Метка ставится только в сборку для Pages,
      # в репозитории и в релизах её нет — на боевой домен она не попадёт.
      - name: Закрыть превью от поисковиков
        run: |
          find site -name '*.html' -exec sed -i 's|</head>|  <meta name="robots" content="noindex, nofollow">\n</head>|' {} +
          for f in $(find site -name '*.html'); do
            grep -q 'name="robots"' "$f" || { echo "noindex не добавлен: $f"; exit 1; }
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
