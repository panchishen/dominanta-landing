  --font-sans: 'Onest', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;

  /* ── Semantic · color (Light) — alias → primitive ── */
  --color-action-primary: var(--color-brand-500);
  --color-action-primary-hover: var(--color-brand-600);
  --color-action-neutral: var(--color-neutral-900);
  --color-action-neutral-hover: var(--color-neutral-800);
  --color-action-neutral-pressed: var(--color-neutral-900);
  --color-action-secondary: var(--color-neutral-100);
  --color-action-secondary-hover: var(--color-neutral-200);
  --color-bg-accent-subtle: var(--color-brand-50);
  --color-bg-brand-subtle: var(--color-neutral-100);
  --color-bg-canvas: var(--color-neutral-0);
  --color-bg-inverse: var(--color-neutral-900);
  --color-bg-muted: var(--color-neutral-100);
  --color-bg-subtle: var(--color-neutral-50);

  --color-feedback-error: var(--color-error-500);
  --color-feedback-error-bg: var(--color-error-50);
  --color-feedback-info: var(--color-info-500);
  --color-feedback-info-bg: var(--color-info-50);
  --color-feedback-success: var(--color-success-500);
  --color-feedback-success-bg: var(--color-success-50);
  --color-feedback-warning: var(--color-warning-500);
  --color-feedback-warning-bg: var(--color-warning-50);
  --color-focus-ring: var(--color-brand-600);
  --color-surface-default: var(--color-neutral-0);
  --color-surface-sunken: var(--color-neutral-50);
  --color-text-accent: var(--color-brand-700);
  --color-text-accent-on-dark: var(--color-brand-400);
  --color-text-accent-strong: var(--color-brand-800);
  --color-text-brand: var(--color-brand-800);
  --color-text-disabled: var(--color-neutral-400);
  --color-text-error: var(--color-error-600);
  --color-text-inverse: var(--color-neutral-0);
  --color-text-on-primary: var(--color-brand-on);
  --color-text-on-neutral: var(--color-neutral-0);
  --color-text-primary: var(--color-neutral-900);
  --color-text-secondary: var(--color-neutral-600);
  --color-text-success: var(--color-success-600);
  --color-text-tertiary: var(--color-neutral-500);
}

/* ── preview scaffold ── */
@import url('https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap');
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--font-sans);background:var(--color-bg-canvas);color:var(--color-text-primary);padding:32px;-webkit-font-smoothing:antialiased}
.ds-wrap{display:flex;flex-direction:column;gap:28px;max-width:1080px;margin:0 auto}
.ds-title{font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-text-tertiary);margin:0}
.ds-grid{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.ds-stack{display:flex;flex-direction:column;gap:10px}
.ds-cap{font-size:12px;line-height:1.4;color:var(--color-text-tertiary)}
.ds-cap b{color:var(--color-text-secondary);font-weight:600}
.ds-cell{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
</style></head>
<body><div class="ds-wrap">
<style>
  .tabs-row {
    display: flex;
    align-items: flex-end;
    gap: var(--space-lg);
    border-bottom: var(--border-sm) solid var(--color-border-default);
  }
  .tabs-tab {
    padding: var(--space-sm) var(--space-xs);
    color: var(--color-text-secondary);
    background: transparent;
    border: none;
    border-bottom: var(--border-lg) solid transparent;
    margin-bottom: calc(-1 * var(--border-sm));
    cursor: pointer;
    white-space: nowrap;
  }
  .tabs-tab--active {
    color: var(--color-text-brand);
    border-bottom-color: var(--color-action-neutral);
  }
  .tabs-tab--hover {
    color: var(--color-text-primary);
  }
</style>

<div class="ds-stack">
  <div class="ds-title">Tabs — подчёркнутые вкладки</div>

  <div class="ds-stack">
    <div class="tabs-row">
      <button class="tabs-tab tabs-tab--active text-label-lg">Услуги</button>
      <button class="tabs-tab tabs-tab--hover text-label-lg">Врачи</button>
      <button class="tabs-tab text-label-lg">Цены</button>
      <button class="tabs-tab text-label-lg">Отзывы</button>
    </div>
    <div class="ds-cap">Вкладки в сборе: Услуги (active) · Врачи (hover) · Цены, Отзывы (default)</div>
  </div>

  <div class="ds-title">Состояния по отдельности</div>

  <div class="ds-grid">
    <div class="ds-cell">
      <div class="tabs-row">
        <button class="tabs-tab tabs-tab--active text-label-lg">Услуги</button>
      </div>
      <div class="ds-cap">Active</div>
    </div>

    <div class="ds-cell">
      <div class="tabs-row">
        <button class="tabs-tab text-label-lg">Цены</button>
      </div>
      <div class="ds-cap">Default</div>
    </div>

    <div class="ds-cell">
      <div class="tabs-row">
        <button class="tabs-tab tabs-tab--hover text-label-lg">Врачи</button>
      </div>
      <div class="ds-cap">Hover</div>
    </div>
  </div>
</div>
</div></body></html>
