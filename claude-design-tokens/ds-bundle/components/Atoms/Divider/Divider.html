  --space-lg: 24px;
  --space-md: 16px;
  --space-section-y: 96px;
  --space-section-y-mobile: 56px;
  --space-sm: 12px;
  --space-xl: 32px;
  --space-xs: 8px;

  /* ── Elevation · shadows ── */
  --shadow-focus: 0px 0px 0px 4px #6366DA40;
  --shadow-lg: 0px 12px 28px 0px #101E281F;
  --shadow-md: 0px 6px 16px 0px #101E281A;

  /* ── Typography ── */
  --font-sans: 'Onest', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;

  /* ── Semantic · color (Light) — alias → primitive ── */
  --color-action-primary: var(--color-accent-500);
  --color-action-primary-hover: var(--color-accent-600);
  --color-action-neutral: var(--color-primary-500);
  --color-action-neutral-hover: var(--color-primary-600);
  --color-action-neutral-pressed: var(--color-primary-700);
  --color-action-secondary: var(--color-primary-50);
  --color-action-secondary-hover: var(--color-primary-100);
  --color-bg-accent-subtle: var(--color-accent-50);
  --color-bg-brand-subtle: var(--color-primary-50);
  --color-bg-canvas: var(--color-neutral-0);
  --color-bg-inverse: var(--color-primary-900);
  --color-bg-muted: var(--color-neutral-100);
  --color-bg-subtle: var(--color-neutral-50);
  --color-border-accent: var(--color-accent-500);
  --color-border-default: var(--color-neutral-200);
  --color-border-error: var(--color-error-500);
  --color-border-focus: var(--color-primary-500);
  --color-border-strong: var(--color-neutral-300);
  --color-border-subtle: var(--color-neutral-100);
  --color-feedback-error: var(--color-error-500);
  --color-feedback-error-bg: var(--color-error-50);
  --color-feedback-info: var(--color-info-500);
  --color-feedback-info-bg: var(--color-info-50);
  --color-feedback-success: var(--color-success-500);
  --color-feedback-success-bg: var(--color-success-50);
  --color-feedback-warning: var(--color-warning-500);
  --color-feedback-warning-bg: var(--color-warning-50);
  --color-focus-ring: var(--color-primary-400);
  --color-surface-default: var(--color-neutral-0);
  --color-surface-sunken: var(--color-neutral-50);
  --color-text-accent: var(--color-accent-800);
  --color-text-brand: var(--color-primary-700);
  --color-text-disabled: var(--color-neutral-400);
  --color-text-error: var(--color-error-600);
  --color-text-inverse: var(--color-neutral-0);
  --color-text-on-primary: var(--color-accent-900);
  --color-text-on-neutral: var(--color-neutral-0);
  --color-text-primary: var(--color-neutral-900);
  --color-text-secondary: var(--color-neutral-600);
  --color-text-success: var(--color-success-600);
  --color-text-tertiary: var(--color-neutral-500);
}

/* ── preview scaffold ── */
@import url("../../../fonts/onest.css");
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--font-sans);background:var(--color-bg-canvas);color:var(--color-text-primary);padding:32px;-webkit-font-smoothing:antialiased}
.ds-wrap{display:flex;flex-direction:column;gap:28px;max-width:1080px;margin:0 auto}
.ds-title{font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-text-tertiary);margin:0}
.ds-grid{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.ds-stack{display:flex;flex-direction:column;gap:10px}
.ds-cap{font-size:12px;line-height:1.4;color:var(--color-text-tertiary)}

<body><div class="ds-wrap">
<style>
  .ddiv-stack { display: flex; flex-direction: column; gap: var(--space-2xs); }
  .ddiv-block {
    background: var(--color-surface-default);
    border: var(--border-sm) solid var(--color-border-subtle);
    border-radius: var(--radius-lg);
    padding: var(--space-lg);
  }
  /* Horizontal */
  .ddiv-hr {
    border: 0;
    height: 1px;
    width: 100%;
    background: var(--color-border-default);
    margin: 0;
  }
  .ddiv-content { color: var(--color-text-secondary); }
  /* Vertical */
  .ddiv-vrow {
    display: flex;
    align-items: center;
    gap: var(--space-lg);
    min-height: 64px;
  }
  .ddiv-vr {
    width: 1px;
    height: 64px;
    background: var(--color-border-default);
    flex: none;
  }
  .ddiv-vcol { display: flex; flex-direction: column; gap: var(--space-3xs); }
  /* Labelled */
  .ddiv-labelled {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    width: 100%;
  }
  .ddiv-labelled::before,
  .ddiv-labelled::after {
    content: "";
    flex: 1 1 auto;
    height: 1px;
    background: var(--color-border-default);
  }
  .ddiv-label {
    flex: none;
    color: var(--color-text-tertiary);
    background: var(--color-bg-canvas);
    padding: 0 var(--space-2xs);
    white-space: nowrap;
  }
</style>

<div class="ds-stack" style="gap: var(--space-lg);">

  <div class="ds-title">Divider · разделители</div>

  <div class="ds-grid" style="gap: var(--space-lg); align-items: stretch;">

    <div class="ds-cell">
      <div class="ddiv-block" style="width: 320px; box-sizing: border-box;">
        <div class="ddiv-stack">
          <div class="text-label-sm ddiv-content">Личные данные пациента</div>
          <hr class="ddiv-hr" />
          <div class="text-label-sm ddiv-content">Медицинская карта</div>
        </div>
      </div>
      <span class="ds-cap">Horizontal · 1px на всю ширину</span>
    </div>

    <div class="ds-cell">
      <div class="ddiv-block">
        <div class="ddiv-vrow">
          <div class="ddiv-vcol">
            <div class="text-label-md" style="color: var(--color-text-primary);">Имплантация</div>
            <div class="text-caption" style="color: var(--color-text-tertiary);">от 38 000 ₽</div>
          </div>
          <div class="ddiv-vr"></div>
          <div class="ddiv-vcol">
            <div class="text-label-md" style="color: var(--color-text-primary);">Гарантия</div>
            <div class="text-caption" style="color: var(--color-text-tertiary);">10 лет</div>
          </div>
          <div class="ddiv-vr"></div>
          <div class="ddiv-vcol">
            <div class="text-label-md" style="color: var(--color-text-primary);">Срок</div>
            <div class="text-caption" style="color: var(--color-text-tertiary);">1 визит</div>
          </div>
        </div>
      </div>
      <span class="ds-cap">Vertical · 1px × 64</span>
    </div>

    <div class="ds-cell">
      <div class="ddiv-block" style="width: 320px; box-sizing: border-box;">
        <div class="ddiv-stack" style="gap: var(--space-md);">
          <div class="text-body-sm ddiv-content">Войти по номеру карты пациента</div>
          <div class="ddiv-labelled">
            <span class="ddiv-label text-caption">или</span>
          </div>
          <div class="text-body-sm ddiv-content">Записаться как новый пациент</div>
        </div>
      </div>
      <span class="ds-cap">Labelled · текст по центру линии</span>
    </div>

  </div>
</div>
</div></body></html>
