:root {

  --color-neutral-0: #FFFFFF;
  --color-neutral-100: #EFF2F4;

  --color-neutral-400: #9FAAB1;
  --color-neutral-50: #F7F9FA;
  --color-neutral-500: #6E7A82;
  --color-neutral-600: #515C64;
  --color-neutral-700: #3B454C;
  --color-neutral-800: #252D32;
  --color-neutral-900: #141A1E;
  --color-primary-100: #D9DAF6;
  --color-primary-200: #B7B8EE;
  --color-primary-300: #9092E6;
  --color-primary-400: #6366DA;
  --color-primary-50: #EEEEFB;
  --color-primary-500: #3538CD;
  --color-primary-600: #2A2DAE;
  --color-primary-700: #23258C;
  --color-primary-800: #1D1E6E;
  --color-primary-900: #161747;
  --color-success-50: #E7F6EE;

  --color-success-600: #157A45;
  --color-warning-50: #FDF3E2;
  --color-warning-500: #E08A12;

  /* ── Scale · spacing / radius / border / icon / layout / opacity / motion / breakpoints ── */
  --border-lg: 2px;
  --border-md: 1.5px;
  --border-sm: 1px;
  --bp-desktop: 1440px;

  --layout-columns: 12;
  --layout-container-max: 1200px;
  --layout-gutter: 24px;
  --motion-duration-base: 200ms;
  --motion-duration-exit: 150ms;
  --motion-duration-fast: 150ms;
  --motion-duration-moderate: 300ms;
  --motion-duration-slow: 400ms;
  --motion-easing-enter: cubic-bezier(0, 0, 0.2, 1);
  --motion-easing-exit: cubic-bezier(0.4, 0, 1, 1);

  --motion-easing-standard: cubic-bezier(0.2, 0, 0, 1);

  --opacity-disabled: 0.4;
  --opacity-hover: 0.08;
  --opacity-pressed: 0.12;
  --radius-2xl: 32px;
  --radius-full: 999px;
  --radius-lg: 16px;
  --radius-md: 12px;
  --radius-none: 0px;
  --radius-sm: 8px;
  --radius-xl: 24px;
  --radius-xs: 4px;
  --space-2xl: 48px;
  --space-2xs: 4px;
  --space-3xl: 64px;
  --space-3xs: 2px;
  --space-4xl: 96px;
  --space-5xl: 128px;
  --space-container-x: 24px;
  --space-grid-gap: 24px;
  --space-lg: 24px;
  --space-md: 16px;
  --space-section-y: 96px;
  --space-section-y-mobile: 56px;
  --space-sm: 12px;
  --space-xl: 32px;
  --space-xs: 8px;

  /* ── Elevation · shadows ── */
  --shadow-focus: 0px 0px 0px 4px #6366DA40;
  --shadow-lg: 0px 12px 28px 0px #101E281F;
  --shadow-md: 0px 6px 16px 0px #101E281A;
  --shadow-sm: 0px 2px 6px 0px #101E2814;
  --shadow-xl: 0px 24px 48px 0px #101E2829;
  --shadow-xs: 0px 1px 2px 0px #101E280F;

  /* ── Typography ── */
  --font-sans: 'Onest', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;

  /* ── Semantic · color (Light) — alias → primitive ── */
  --color-action-primary: var(--color-accent-500);
  --color-action-primary-hover: var(--color-accent-600);
  --color-action-neutral: var(--color-primary-500);
  --color-action-neutral-hover: var(--color-primary-600);
  --color-action-neutral-pressed: var(--color-primary-700);
  --color-action-secondary: var(--color-primary-50);
  --color-action-secondary-hover: var(--color-primary-100);
  --color-bg-accent-subtle: var(--color-accent-50);
  --color-bg-brand-subtle: var(--color-primary-50);
  --color-bg-canvas: var(--color-neutral-0);
  --color-bg-inverse: var(--color-primary-900);
  --color-bg-muted: var(--color-neutral-100);
  --color-bg-subtle: var(--color-neutral-50);
  --color-border-accent: var(--color-accent-500);
  --color-border-default: var(--color-neutral-200);
  --color-border-error: var(--color-error-500);
  --color-border-focus: var(--color-primary-500);
  --color-border-strong: var(--color-neutral-300);
  --color-border-subtle: var(--color-neutral-100);
  --color-feedback-error: var(--color-error-500);
  --color-feedback-error-bg: var(--color-error-50);
  --color-feedback-info: var(--color-info-500);
  --color-feedback-info-bg: var(--color-info-50);
  --color-feedback-success: var(--color-success-500);
  --color-feedback-success-bg: var(--color-success-50);
  --color-feedback-warning: var(--color-warning-500);
  --color-feedback-warning-bg: var(--color-warning-50);
  --color-focus-ring: var(--color-primary-400);
  --color-surface-default: var(--color-neutral-0);
  --color-surface-sunken: var(--color-neutral-50);
  --color-text-accent: var(--color-accent-800);
  --color-text-brand: var(--color-primary-700);
  --color-text-disabled: var(--color-neutral-400);
  --color-text-error: var(--color-error-600);
  --color-text-inverse: var(--color-neutral-0);
  --color-text-on-primary: var(--color-accent-900);
  --color-text-on-neutral: var(--color-neutral-0);
  --color-text-primary: var(--color-neutral-900);
  --color-text-secondary: var(--color-neutral-600);
  --color-text-success: var(--color-success-600);
  --color-text-tertiary: var(--color-neutral-500);
}

/* ── preview scaffold ── */
@import url("../../../fonts/onest.css");
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--font-sans);background:var(--color-bg-canvas);color:var(--color-text-primary);padding:32px;-webkit-font-smoothing:antialiased}
.ds-wrap{display:flex;flex-direction:column;gap:28px;max-width:1080px;margin:0 auto}

<body><div class="ds-wrap">
<style>
  .btn-demo-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-xs);
    border: none;
    border-radius: var(--radius-md);
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
  }
  .btn-demo-btn svg { width: var(--icon-md); height: var(--icon-md); flex: 0 0 auto; }
  .btn-demo-sm { height: 36px; padding: var(--space-xs) var(--space-md); }
  .btn-demo-md { height: 44px; padding: var(--space-sm) 20px; }
  .btn-demo-lg { height: 52px; padding: var(--space-md) 28px; }

  .btn-demo-primary { background: var(--color-action-neutral); color: var(--color-text-on-neutral); }
  .btn-demo-primary:hover { background: var(--color-action-neutral-hover); }
  .btn-demo-primary:active { background: var(--color-action-neutral-pressed); }

  .btn-demo-secondary { background: var(--color-action-secondary); color: var(--color-text-brand); }
  .btn-demo-secondary:hover { background: var(--color-action-secondary-hover); }

  .btn-demo-accent { background: var(--color-action-primary); color: var(--color-text-on-primary); }
  .btn-demo-accent:hover { background: var(--color-action-primary-hover); }

  .btn-demo-white { background: var(--color-surface-default); color: var(--color-text-primary); box-shadow: var(--shadow-xs); }

  .btn-demo-disabled { background: var(--color-bg-muted); color: var(--color-text-disabled); cursor: not-allowed; box-shadow: none; }

  .btn-demo-focus { box-shadow: var(--shadow-focus); }

  .btn-demo-rowhead {
    display: flex;
    align-items: center;
    min-width: 92px;
    color: var(--color-text-secondary);
  }
  .btn-demo-rowgrid {
    display: flex;
    align-items: center;
    gap: var(--space-lg);
    flex-wrap: wrap;
  }
  .btn-demo-sizes {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    flex-wrap: wrap;
  }
</style>
